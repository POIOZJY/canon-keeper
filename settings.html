<div id="canon_keeper_settings" class="canon-keeper-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Canon Keeper</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>

        <div class="inline-drawer-content">
            <p>
                每个聊天独立保存并注入世界设定。
            </p>

            <label for="canon_keeper_canon">
                <b>当前设定</b>
            </label>

            <textarea
                id="canon_keeper_canon"
                class="text_pole textarea_compact"
                rows="10"
                placeholder="这里以后填写当前世界的权威设定……"
            ></textarea>

            <br>

            <label for="canon_keeper_history">
                <b>历史锚点</b>
            </label>

            <textarea
                id="canon_keeper_history"
                class="text_pole textarea_compact"
                rows="6"
                placeholder="这里以后保存理解当前世界所必需的少量历史……"
            ></textarea>

            <div id="canon_keeper_save" class="menu_button">
                保存
            </div>

            <small id="canon_keeper_status">
                尚未保存
            </small>
        </div>
    </div>
</div>
