<div id="canon_keeper_settings" class="extension_container">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Canon Keeper 动态长期设定</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content ck-panel">
            <div id="ck_no_chat" class="ck-notice is-hidden">请先打开一个角色聊天，再编辑设定。</div>

            <label class="checkbox_label">
                <input id="ck_enabled" class="ck-requires-chat" type="checkbox">
                <span>启用设定注入</span>
            </label>
            <label class="checkbox_label">
                <input id="ck_auto_update" class="ck-requires-chat" type="checkbox">
                <span>正文完成后静默检查长期变化</span>
            </label>
            <label class="checkbox_label">
                <input id="ck_allow_additions" class="ck-requires-chat" type="checkbox">
                <span>允许严格受限的长期事实新增</span>
            </label>

            <label for="ck_memory_text"><strong>当前用户设定</strong></label>
            <textarea id="ck_memory_text" class="text_pole ck-requires-chat" rows="14" placeholder="在这里粘贴世界观、人物和长期设定……"></textarea>
            <div class="ck-help">自动修改只做精确最小替换。手动保存会把当前文字设为新基准，并清空旧自动修改记录。</div>

            <div class="ck-row">
                <button id="ck_save" class="menu_button ck-requires-chat">保存新基准（清历史）</button>
                <button id="ck_retry" class="menu_button ck-requires-chat">重查最后回复</button>
                <button id="ck_export" class="menu_button ck-requires-chat">导出备份</button>
                <label class="menu_button ck-file-button ck-requires-chat">导入备份<input id="ck_import" type="file" accept="application/json,.json"></label>
            </div>

            <div class="ck-row ck-limit-row">
                <label for="ck_addition_ratio">自动补充区上限：</label>
                <input id="ck_addition_ratio" class="text_pole ck-requires-chat" type="number" min="5" max="100" step="5">
                <span>%（相对用户设定字符数）</span>
            </div>

            <div class="ck-meta">
                <span id="ck_tokens">实际注入：0 tokens</span>
                <span id="ck_status" data-kind="idle">就绪</span>
            </div>

            <details>
                <summary><strong>查看本轮实际注入内容</strong></summary>
                <pre id="ck_prompt_preview" class="ck-prompt-preview"></pre>
            </details>

            <details>
                <summary><strong>剧情确认的长期补充</strong></summary>
                <div id="ck_additions" class="ck-list"></div>
            </details>

            <details>
                <summary><strong>后台检查、修改与回滚记录</strong></summary>
                <div id="ck_history" class="ck-list"></div>
                <button id="ck_clear_auto" class="menu_button redWarningBG ck-requires-chat">清空所有自动记录</button>
            </details>
        </div>
    </div>
</div>
