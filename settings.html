<div id="canon_keeper_settings" class="canon-keeper-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Canon Keeper</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>

        <div class="inline-drawer-content">

            <div class="canon-keeper-section">
                <h4>当前聊天 Canon</h4>

                <p class="canon-keeper-description">
                    以下内容只属于当前聊天。切换聊天后会自动切换到另一个世界的 Canon。
                </p>

                <label for="canon_keeper_canon">
                    <b>当前设定</b>
                </label>

                <textarea
                    id="canon_keeper_canon"
                    class="text_pole"
                    rows="12"
                    placeholder="记录这个世界当前真正成立的权威设定。"
                ></textarea>

                <label for="canon_keeper_history">
                    <b>历史锚点</b>
                </label>

                <textarea
                    id="canon_keeper_history"
                    class="text_pole"
                    rows="7"
                    placeholder="只记录理解当前状态所必需的重要历史。"
                ></textarea>

                <button
                    id="canon_keeper_save"
                    type="button"
                    class="menu_button canon-keeper-button"
                >
                    保存当前聊天设定
                </button>

                <small id="canon_keeper_status" class="canon-keeper-status">
                    尚未加载
                </small>
            </div>

            <hr>

            <div class="canon-keeper-section">
                <h4>独立 AI API</h4>

                <p class="canon-keeper-description">
                    此 API 以后只负责分析聊天、提出 Canon 修改和维护历史锚点。
                    它不会替代 SillyTavern 当前用于角色回复的主 API。
                </p>

                <label class="canon-keeper-checkbox-row">
                    <input
                        id="canon_keeper_api_enabled"
                        type="checkbox"
                    >
                    <span>启用独立 AI API</span>
                </label>

                <label for="canon_keeper_api_url">
                    <b>API 地址</b>
                </label>

                <input
                    id="canon_keeper_api_url"
                    class="text_pole"
                    type="text"
                    placeholder="以后在这里填写 OpenAI Compatible API 地址"
                    autocomplete="off"
                >

                <label for="canon_keeper_api_key">
                    <b>API Key</b>
                </label>

                <div class="canon-keeper-key-row">
                    <input
                        id="canon_keeper_api_key"
                        class="text_pole"
                        type="password"
                        placeholder="在这里填写 API Key"
                        autocomplete="off"
                    >

                    <button
                        id="canon_keeper_toggle_key"
                        type="button"
                        class="menu_button canon-keeper-small-button"
                    >
                        显示
                    </button>
                </div>

                <label for="canon_keeper_api_model">
                    <b>模型名称</b>
                </label>

                <input
                    id="canon_keeper_api_model"
                    class="text_pole"
                    type="text"
                    placeholder="以后在这里填写模型名称"
                    autocomplete="off"
                >

                <button
                    id="canon_keeper_save_api"
                    type="button"
                    class="menu_button canon-keeper-button"
                >
                    保存独立 API 设置
                </button>

                <small id="canon_keeper_api_status" class="canon-keeper-status">
                    独立 API：未启用
                </small>

                <div class="canon-keeper-notice">
                    当前版本只保存独立 API 配置，还不会调用它。
                    下一阶段才会加入测试连接和 AI 自动维护。
                </div>
            </div>

        </div>
    </div>
</div>            <div id="canon_keeper_save" class="menu_button">
                保存
            </div>

            <small id="canon_keeper_status">
                尚未保存
            </small>
        </div>
    </div>
</div>
